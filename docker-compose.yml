services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calib
      POSTGRES_PASSWORD: calib
      POSTGRES_DB: calib
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calib -d calib"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://calib:calib@db:5432/calib
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
